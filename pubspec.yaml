name: digital_vault
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  flutter_svg: ^2.3.0
  photo_view: ^0.15.0
  file_picker: ^11.0.2
  pdfx: ^2.9.2
  http: ^1.6.0
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1
  app_links: ^7.0.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# app_links >=7.1.0 (a transitive dependency of supabase_flutter, used for
# OAuth/deep-link redirect handling this app doesn't use) hardcodes a
# buildscript classpath on com.android.tools.build:gradle:9.2.1, which
# doesn't resolve from any Maven repository (Google, Maven Central, or the
# Gradle Plugin Portal) -- appears to reference an AGP version that isn't
# actually published yet. 7.0.0 is the last release before that switch and
# has no Kotlin source at all (pure Java), sidestepping this entirely.
#
# path_provider_android >=2.3.0 rewrote itself on top of package:jni, whose
# Android Gradle plugin (jni-1.0.1) is broken under AGP 9 (assumes Kotlin is
# already applied for AGP 9+, which it isn't here). Pin to the last
# jni-free release until upstream fixes AGP 9 support.
#
# file_picker 11.x has the same class of bug: its android/build.gradle only
# applies 'org.jetbrains.kotlin.android' when AGP < 9, wrongly assuming AGP 9
# applies Kotlin support itself for library subprojects. Result: its .kt
# sources never compile and GeneratedPluginRegistrant fails with "cannot
# find symbol: class FilePickerPlugin". 10.3.10 is the last non-retracted
# release that applies the Kotlin plugin unconditionally; it also carries
# the Apache Tika fix for CVE-2025-66516 / CVE-2025-54988 (critical XXE).
# 10.3.11 fixes the same CVEs but is retracted on pub.dev, so avoid it.
dependency_overrides:
  path_provider_android: 2.2.23
  file_picker: 10.3.10
  app_links: 7.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-packagedart --version